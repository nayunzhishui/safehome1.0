name: SafeHome Branch Governance Sync

on:
  push:
    branches:
      - codex/safehome-security-enhancement-20260807

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'chore(governance-generated):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/safehome-security-enhancement-20260807
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize governance registries
        run: python backend/scripts/sync_api_governance_registries.py

      - name: Commit generated registries when changed
        shell: bash
        run: |
          git add content/security_privacy_abuse_registry.json content/operations_capability_registry.json
          if git diff --cached --quiet; then
            echo 'Governance registries already current.'
            exit 0
          fi
          git config user.name 'safehome-governance-bot'
          git config user.email 'safehome-governance-bot@users.noreply.github.com'
          git commit -m 'chore(governance-generated): sync API governance registries'
          git push origin HEAD:codex/safehome-security-enhancement-20260807
