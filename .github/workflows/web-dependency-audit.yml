name: SafeHome Web Dependency Audit

on:
  push:
    branches:
      - codex/safehome-dependency-governance-20260807

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Print dependency tree for legacy tooling
        working-directory: apps/web
        run: npm ls miniprogram-automator jimp @jimp/core phin core-js --all || true
      - name: Print structured audit
        working-directory: apps/web
        run: |
          npm audit --json > npm-audit.json || true
          cat npm-audit.json
      - name: Check non-breaking audit fix plan
        working-directory: apps/web
        run: npm audit fix --dry-run --json || true
