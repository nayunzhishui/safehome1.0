name: SafeHome Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r analysis/text_analysis/requirements.txt
          python -m pip install -r analysis/profiling/requirements.txt
          python -m pip check

      - name: Inspect release artifact hashes
        run: python backend/scripts/print_release_artifact_hashes.py

      - name: Validate content
        run: python backend/scripts/validate_content.py

      - name: Check API contract drift
        run: |
          if ! python backend/scripts/build_api_contract.py --check; then
            python backend/scripts/build_api_contract.py
            git diff -- \
              shared/contracts/api-contract.json \
              shared/types/api-contract.generated.ts \
              apps/miniprogram/services/api-contract.generated.js \
              docs/03_技术真相/API机器契约.md
            exit 1
          fi

      - name: Check API query boundaries
        run: python backend/scripts/audit_api_boundaries.py --check

      - name: Replay API compatibility snapshot
        run: python backend/scripts/check_api_compatibility.py

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests -q

      - name: Run AI continuous quality gate
        run: python -m pytest backend/tests/test_task37_c08_ai_quality.py -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Check shared design tokens
        run: python scripts/check_design_tokens.py

      - name: Audit miniprogram UI governance
        run: python scripts/audit_miniprogram_ui_governance.py

      - name: Audit participant visual states
        run: node scripts/audit_task23_visual_system.mjs

      - name: Audit miniprogram structure
        run: python backend/scripts/audit_miniprogram_frontend.py

      - name: Validate miniprogram JavaScript and JSON
        run: python backend/scripts/validate_miniprogram_assets.py
