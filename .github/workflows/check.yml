name: SafeHome Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r analysis/text_analysis/requirements.txt
          python -m pip install -r analysis/profiling/requirements.txt

      - name: Validate content
        run: python backend/scripts/validate_content.py

      - name: Check API contract drift
        run: python backend/scripts/build_api_contract.py --check

      - name: Check API query boundaries
        run: python backend/scripts/audit_api_boundaries.py --check

      - name: Replay API compatibility snapshot
        run: python backend/scripts/check_api_compatibility.py

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Audit miniprogram structure
        run: python backend/scripts/audit_miniprogram_frontend.py

      - name: Validate miniprogram JavaScript and JSON
        run: python backend/scripts/validate_miniprogram_assets.py
