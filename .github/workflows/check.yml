name: SafeHome Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r analysis/text_analysis/requirements.txt

      - name: Validate content
        run: python backend/scripts/validate_content.py

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        run: |
          cd apps/web
          npm install
          npm run build
