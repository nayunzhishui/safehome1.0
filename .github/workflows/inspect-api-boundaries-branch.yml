name: SafeHome Branch API Boundary Inspection

on:
  push:
    branches:
      - codex/safehome-security-enhancement-20260807

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/safehome-security-enhancement-20260807
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and print API boundary diff
        shell: bash
        run: |
          python backend/scripts/audit_api_boundaries.py
          echo '=== CHANGED FILES ==='
          git diff --name-only
          echo '=== DIFF ==='
          git diff --unified=3
