name: SafeHome Branch API Boundary Refresh

on:
  push:
    branches:
      - codex/safehome-security-enhancement-20260807

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore(boundaries-generated):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/safehome-security-enhancement-20260807
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate API query boundary artifacts
        run: python backend/scripts/audit_api_boundaries.py
      - name: Commit generated boundary artifacts when changed
        shell: bash
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo 'API boundary artifacts already current.'
            exit 0
          fi
          git config user.name 'safehome-boundary-bot'
          git config user.email 'safehome-boundary-bot@users.noreply.github.com'
          git commit -m 'chore(boundaries-generated): refresh API boundary artifacts'
          git push origin HEAD:codex/safehome-security-enhancement-20260807
