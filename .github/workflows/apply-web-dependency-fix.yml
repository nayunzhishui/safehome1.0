name: Apply SafeHome Web Dependency Fix

on:
  push:
    branches:
      - codex/safehome-dependency-governance-20260807
    paths:
      - .github/workflows/apply-web-dependency-fix.yml

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/safehome-dependency-governance-20260807
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply reviewed non-breaking npm audit fix
        working-directory: apps/web
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high
      - name: Assert lockfile-only dependency change
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "apps/web/package-lock.json"
      - name: Commit reviewed lockfile fix
        run: |
          git config user.name "safehome-ci"
          git config user.email "safehome-ci@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "fix(deps): patch audited PostCSS vulnerability"
          git push origin HEAD:codex/safehome-dependency-governance-20260807
