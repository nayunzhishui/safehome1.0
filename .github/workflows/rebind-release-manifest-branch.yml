name: SafeHome Branch Release Manifest Rebind

on:
  push:
    branches:
      - codex/safehome-security-enhancement-20260807

permissions:
  contents: write

jobs:
  rebind:
    if: ${{ !contains(github.event.head_commit.message, 'chore(manifest-generated):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/safehome-security-enhancement-20260807
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebind release hashes
        run: python backend/scripts/rebind_release_manifest.py --apply
      - name: Commit manifest when changed
        shell: bash
        run: |
          git add content/operations_release_manifest.json
          if git diff --cached --quiet; then
            echo 'Release manifest already current.'
            exit 0
          fi
          git config user.name 'safehome-manifest-bot'
          git config user.email 'safehome-manifest-bot@users.noreply.github.com'
          git commit -m 'chore(manifest-generated): rebind reviewed release artifact hashes'
          git push origin HEAD:codex/safehome-security-enhancement-20260807
